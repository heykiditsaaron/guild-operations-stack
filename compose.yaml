services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://guild_operations:guild_operations@db:5432/guild_operations
    ports:
      - "3100:3100"
    volumes:
      - .:/app
      - guild-operations-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: guild_operations
      POSTGRES_USER: guild_operations
      POSTGRES_PASSWORD: guild_operations
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - guild-operations-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild_operations -d guild_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guild-operations-db:
  guild-operations-node-modules:
