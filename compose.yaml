services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: guild_operations
      POSTGRES_USER: guild_operations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guild_operations}
    volumes:
      - guild-operations-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild_operations -d guild_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/heykiditsaaron/guild-operations:${GUILD_OPERATIONS_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    command: node dist/migrate.js
    environment:
      GUILD_OPERATIONS_PROCESS: migrate
      DATABASE_URL: ${DATABASE_URL:-postgresql://guild_operations:${POSTGRES_PASSWORD:-guild_operations}@db:5432/guild_operations}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"

  api:
    image: ghcr.io/heykiditsaaron/guild-operations:${GUILD_OPERATIONS_VERSION:-latest}
    environment:
      GUILD_OPERATIONS_PROCESS: api
      DATABASE_URL: ${DATABASE_URL:-postgresql://guild_operations:${POSTGRES_PASSWORD:-guild_operations}@db:5432/guild_operations}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    ports:
      - "${HTTP_PORT:-3000}:3100"
    volumes:
      - guild-operations-installation:/var/lib/guild-operations
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  discord:
    image: ghcr.io/heykiditsaaron/guild-operations:${GUILD_OPERATIONS_VERSION:-latest}
    command: node dist/discord.js
    environment:
      GUILD_OPERATIONS_PROCESS: discord
      DATABASE_URL: ${DATABASE_URL:-postgresql://guild_operations:${POSTGRES_PASSWORD:-guild_operations}@db:5432/guild_operations}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    volumes:
      - guild-operations-installation:/var/lib/guild-operations
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  guild-operations-db:
  guild-operations-installation:
