# New installations only. Generate files with ./scripts/init-bundled-db-secrets.sh.
# Do not apply to an existing bundled PostgreSQL volume without a credential migration.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - ./secrets/postgres-password:/run/secrets/postgres-password:ro
  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database-url
    volumes:
      - ./secrets/database-url:/run/secrets/database-url:ro
  api:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database-url
    volumes:
      - ./secrets/database-url:/run/secrets/database-url:ro
  discord:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database-url
    volumes:
      - ./secrets/database-url:/run/secrets/database-url:ro
