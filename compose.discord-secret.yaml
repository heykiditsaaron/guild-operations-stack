# Optional protected host files for Discord application credentials.
# Create files under ./secrets/ before starting the stack.
# Combine with compose.yaml and any other needed override files.
services:
  api:
    environment:
      DISCORD_APPLICATION_ID: ""
      DISCORD_CLIENT_SECRET: ""
      DISCORD_BOT_TOKEN: ""
      DISCORD_APPLICATION_ID_FILE: /run/secrets/discord-application-id
      DISCORD_CLIENT_SECRET_FILE: /run/secrets/discord-client-secret
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord-bot-token
    volumes:
      - ./secrets/discord-application-id:/run/secrets/discord-application-id:ro
      - ./secrets/discord-client-secret:/run/secrets/discord-client-secret:ro
      - ./secrets/discord-bot-token:/run/secrets/discord-bot-token:ro
  discord:
    environment:
      DISCORD_APPLICATION_ID: ""
      DISCORD_CLIENT_SECRET: ""
      DISCORD_BOT_TOKEN: ""
      DISCORD_APPLICATION_ID_FILE: /run/secrets/discord-application-id
      DISCORD_CLIENT_SECRET_FILE: /run/secrets/discord-client-secret
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord-bot-token
    volumes:
      - ./secrets/discord-application-id:/run/secrets/discord-application-id:ro
      - ./secrets/discord-client-secret:/run/secrets/discord-client-secret:ro
      - ./secrets/discord-bot-token:/run/secrets/discord-bot-token:ro
