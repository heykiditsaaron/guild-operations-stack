# Independent Administration bootstrap. Do not join the managed application's Compose project.
# Bind the published port to host loopback until a supported remote-access model exists.
name: guild-operations-administration
services:
  administration:
    build:
      context: .
      dockerfile: Dockerfile.administration
    image: guild-operations-administration:local
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-3103}:3103"
    volumes:
      - administration-state:/var/lib/guild-operations-administration
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3103/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  administration-state:
