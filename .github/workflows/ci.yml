name: Guild Operations CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on:
      - self-hosted
      - linux
      - x64
      - guild-operations
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application boundaries
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build container image
        run: docker build --tag guild-operations-ci:${{ github.sha }} .

      - name: Prove Activity plugin optionality
        shell: bash
        run: |
          set -euo pipefail
          restore_activities() {
            rm -rf src/activities
            if [ -d "$RUNNER_TEMP/guild-operations-activities" ]; then
              mv "$RUNNER_TEMP/guild-operations-activities" src/activities
            fi
          }
          trap restore_activities EXIT

          rm -rf "$RUNNER_TEMP/guild-operations-activities"
          mv src/activities "$RUNNER_TEMP/guild-operations-activities"

          mkdir -p src/activities
          cp -R "$RUNNER_TEMP/guild-operations-activities/raid" src/activities/
          npm run typecheck
          npm run build

          rm -rf src/activities
          mkdir -p src/activities
          cp -R "$RUNNER_TEMP/guild-operations-activities/raffle" src/activities/
          npm run typecheck
          npm run build

          rm -rf src/activities
          mkdir -p src/activities
          npm run typecheck
          npm run build
