name: Guild Operations CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  application:
    name: Application verification
    runs-on:
      - self-hosted
      - linux
      - x64
      - guild-operations
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application boundaries
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Establish isolated test database configuration
        run: echo "DATABASE_URL=postgresql://guild_operations_test:test-only-not-a-production-password@127.0.0.1:5432/guild_operations_test" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build container image
        run: docker build --tag guild-operations-ci:${{ github.sha }} .

      - name: Prove Activity plugin optionality
        shell: bash
        run: |
          set -euo pipefail
          restore_activities() {
            rm -rf src/activities
            if [ -d "$RUNNER_TEMP/guild-operations-activities" ]; then
              mv "$RUNNER_TEMP/guild-operations-activities" src/activities
            fi
          }
          trap restore_activities EXIT

          rm -rf "$RUNNER_TEMP/guild-operations-activities"
          mv src/activities "$RUNNER_TEMP/guild-operations-activities"

          mkdir -p src/activities
          cp -R "$RUNNER_TEMP/guild-operations-activities/raid" src/activities/
          npm run typecheck
          npm run build

          rm -rf src/activities
          mkdir -p src/activities
          cp -R "$RUNNER_TEMP/guild-operations-activities/raffle" src/activities/
          npm run typecheck
          npm run build

          rm -rf src/activities
          mkdir -p src/activities
          npm run typecheck
          npm run build

  administration:
    name: Administration verification
    runs-on:
      - self-hosted
      - linux
      - x64
      - guild-operations
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Administration
        run: npm run typecheck

      - name: Test Administration
        run: node --import tsx --test tests/system-administration*.test.ts

      - name: Build Administration
        run: npm run build

      - name: Prove standalone Administration startup without PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export GUILD_OPERATIONS_ADMIN_DATA_DIR="$(mktemp -d)"
          export GUILD_OPERATIONS_ADMIN_PORT=31393
          cleanup() {
            if [ -n "${admin_pid:-}" ]; then
              kill "$admin_pid" 2>/dev/null || true
              wait "$admin_pid" 2>/dev/null || true
            fi
            rm -rf "$GUILD_OPERATIONS_ADMIN_DATA_DIR"
          }
          trap cleanup EXIT
          node dist/system-administration/cli.js status > "$GUILD_OPERATIONS_ADMIN_DATA_DIR/before.json"
          node dist/system-administration/cli.js initialize > "$GUILD_OPERATIONS_ADMIN_DATA_DIR/initialized.json"
          node dist/system-administration/cli.js status > "$GUILD_OPERATIONS_ADMIN_DATA_DIR/after.json"
          node -e 'const fs=require("node:fs");const d=process.env.GUILD_OPERATIONS_ADMIN_DATA_DIR;const before=JSON.parse(fs.readFileSync(d+"/before.json"));const after=JSON.parse(fs.readFileSync(d+"/after.json"));if(before.initialized||!after.initialized||!after.installation?.installationId)process.exit(1)'
          node dist/system-administration/server.js &
          admin_pid=$!
          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$admin_pid" 2>/dev/null; then
              echo "Administration process exited before readiness"
              exit 1
            fi
            if node -e 'fetch("http://127.0.0.1:31393/health").then(r=>r.json()).then(j=>{if(j.status!=="ok")process.exit(1)}).catch(()=>process.exit(1))'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e 'fetch("http://127.0.0.1:31393/status").then(r=>r.json()).then(j=>{if(!j.initialized||"installation" in j)process.exit(1)}).catch(()=>process.exit(1))'

      - name: Build independent Administration image
        run: docker build -f Dockerfile.administration -t guild-operations-administration-ci:${{ github.sha }} .

      - name: Verify mastercontainer startup and persistent state
        shell: bash
        run: |
          set -euo pipefail
          name="go-admin-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${name}-state"
          image="guild-operations-administration-ci:${{ github.sha }}"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume"
          start_admin() {
            docker run -d --name "$name" \
              -v "$volume:/var/lib/guild-operations-administration" \
              "$image" >/dev/null
          }
          start_admin
          for attempt in $(seq 1 30); do
            if docker exec "$name" node -e 'fetch("http://127.0.0.1:3103/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then docker logs "$name"; exit 1; fi
            sleep 1
          done
          docker exec "$name" node dist/system-administration/cli.js initialize
          docker exec "$name" node dist/system-administration/cli.js status > "$RUNNER_TEMP/admin-before.json"
          docker rm -f "$name"
          start_admin
          docker exec "$name" node dist/system-administration/cli.js status > "$RUNNER_TEMP/admin-after.json"
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(process.argv[1]));const b=JSON.parse(fs.readFileSync(process.argv[2]));if(!a.initialized||a.installation.installationId!==b.installation.installationId)process.exit(1)' "$RUNNER_TEMP/admin-before.json" "$RUNNER_TEMP/admin-after.json"
