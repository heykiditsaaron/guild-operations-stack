name: guild-operations-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: guild_operations
      POSTGRES_USER: guild_operations
      POSTGRES_PASSWORD: guild_operations
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - guild-operations-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild_operations -d guild_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    environment:
      GUILD_OPERATIONS_DEVELOPMENT: "true"
    depends_on:
      db:
        condition: service_healthy
    command: node dist/migrate.js
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    environment:
      GUILD_OPERATIONS_DEVELOPMENT: "true"
    ports:
      - "3101:3100"
    volumes:
      - guild-operations-installation:/var/lib/guild-operations
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  guild-operations-db:
  guild-operations-installation:
