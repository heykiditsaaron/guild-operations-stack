# Optional override for a host-managed PostgreSQL connection URL stored in a protected file.
# Use with the chosen base topology, e.g.:
# docker compose -f compose.external-db.yaml -f compose.database-secret.yaml up -d
# Create ./secrets/database-url before starting. Never commit that file.
# This override clears the base topology's direct DATABASE_URL value.
services:
  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database-url
    volumes:
      - ./secrets/database-url:/run/secrets/database-url:ro
  api:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database-url
    volumes:
      - ./secrets/database-url:/run/secrets/database-url:ro
  discord:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database-url
    volumes:
      - ./secrets/database-url:/run/secrets/database-url:ro
