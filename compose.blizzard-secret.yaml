# Optional protected-file configuration for Blizzard application credentials.
# Create ./secrets/blizzard-client-id and ./secrets/blizzard-client-secret first.
# Use with: docker compose -f compose.yaml -f compose.blizzard-secret.yaml up -d
# Keep these files out of version control; /secrets/ is ignored.
services:
  api:
    environment:
      BLIZZARD_CLIENT_ID: ""
      BLIZZARD_CLIENT_SECRET: ""
      BLIZZARD_CLIENT_ID_FILE: /run/secrets/blizzard-client-id
      BLIZZARD_CLIENT_SECRET_FILE: /run/secrets/blizzard-client-secret
    volumes:
      - ./secrets/blizzard-client-id:/run/secrets/blizzard-client-id:ro
      - ./secrets/blizzard-client-secret:/run/secrets/blizzard-client-secret:ro
  discord:
    environment:
      BLIZZARD_CLIENT_ID: ""
      BLIZZARD_CLIENT_SECRET: ""
      BLIZZARD_CLIENT_ID_FILE: /run/secrets/blizzard-client-id
      BLIZZARD_CLIENT_SECRET_FILE: /run/secrets/blizzard-client-secret
    volumes:
      - ./secrets/blizzard-client-id:/run/secrets/blizzard-client-id:ro
      - ./secrets/blizzard-client-secret:/run/secrets/blizzard-client-secret:ro
